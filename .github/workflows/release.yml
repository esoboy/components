name: release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    uses: ./.github/workflows/package.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: UI
    concurrency: publish-esoboy-ui
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esoboy-ui
          path: ${{ runner.temp }}/artifact
      - uses: actions/checkout@v4
        with:
          repository: esoboy/ui
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UI_SPLIT_TOKEN }}
      - name: Publish the verified Composer package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          unzip -q "$RUNNER_TEMP/artifact/esoboy-ui.zip" -d "$RUNNER_TEMP/production"
          rsync -a --delete --exclude='/.git/' "$RUNNER_TEMP/production/" ./
          git add --all
          if git show-ref --quiet --verify "refs/tags/$TAG"; then
            test "$(git write-tree)" = "$(git rev-parse "refs/tags/$TAG^{tree}")"
            exit
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m "esoboy/ui $TAG"; fi
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
