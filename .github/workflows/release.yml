name: release

# A tag (v1.2.0) publishes package/ with its built dist/ to the repository Composer
# installs esoboy/ui from: dist/ is gitignored here, and @uiScripts needs it. Set the
# repository variable UI_SPLIT_REPOSITORY (owner/name) and the secret UI_SPLIT_TOKEN
# (a token that may push to it); until then this does nothing.

on:
  push:
    tags: ['v*']

defaults:
  run:
    working-directory: package

jobs:
  split:
    if: vars.UI_SPLIT_REPOSITORY != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Each release is one commit of the package as it ships, dist/ included, under the tag.
      - env:
          REPOSITORY: ${{ vars.UI_SPLIT_REPOSITORY }}
          TOKEN: ${{ secrets.UI_SPLIT_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sed -i '\#^/dist$#d' .gitignore
          git init --quiet --initial-branch=main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --quiet --message "esoboy/ui ${TAG}"
          git tag "${TAG}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" main "refs/tags/${TAG}"
