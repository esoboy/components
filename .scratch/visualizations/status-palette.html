<figure id="esoboy-status-palette" lang="zh-CN">
  <figcaption>
    <span>实心底色与淡底徽标</span>
    <span class="color-note">HEX 为 sRGB 近似值</span>
  </figcaption>
  <div class="theme-pair">
    <section class="palette-theme theme-light" aria-labelledby="esoboy-status-light">
      <h3 id="esoboy-status-light">浅色主题</h3>
      <ul class="samples">
        <li data-status="neutral">
          <div class="swatch"><div class="label"><span>中性</span><span class="token">neutral</span></div><span class="hex">#F5F5F5</span></div>
          <span class="badge">草稿</span>
        </li>
        <li data-status="info">
          <div class="swatch"><div class="label"><span>信息</span><span class="token">info</span></div><span class="hex">#0069A8</span></div>
          <span class="badge">同步中</span>
        </li>
        <li data-status="success">
          <div class="swatch"><div class="label"><span>成功</span><span class="token">success</span></div><span class="hex">#007A55</span></div>
          <span class="badge">已完成</span>
        </li>
        <li data-status="warning">
          <div class="swatch"><div class="label"><span>警告</span><span class="token">warning</span></div><span class="hex">#FFB900</span></div>
          <span class="badge">即将到期</span>
        </li>
        <li data-status="error">
          <div class="swatch"><div class="label"><span>错误</span><span class="token">error</span></div><span class="hex">#E7000B</span></div>
          <span class="badge">保存失败</span>
        </li>
      </ul>
    </section>
    <section class="palette-theme theme-dark" aria-labelledby="esoboy-status-dark">
      <h3 id="esoboy-status-dark">深色主题</h3>
      <ul class="samples">
        <li data-status="neutral">
          <div class="swatch"><div class="label"><span>中性</span><span class="token">neutral</span></div><span class="hex">#262626</span></div>
          <span class="badge">草稿</span>
        </li>
        <li data-status="info">
          <div class="swatch"><div class="label"><span>信息</span><span class="token">info</span></div><span class="hex">#00BCFF</span></div>
          <span class="badge">同步中</span>
        </li>
        <li data-status="success">
          <div class="swatch"><div class="label"><span>成功</span><span class="token">success</span></div><span class="hex">#00D492</span></div>
          <span class="badge">已完成</span>
        </li>
        <li data-status="warning">
          <div class="swatch"><div class="label"><span>警告</span><span class="token">warning</span></div><span class="hex">#FFD230</span></div>
          <span class="badge">即将到期</span>
        </li>
        <li data-status="error">
          <div class="swatch"><div class="label"><span>错误</span><span class="token">error</span></div><span class="hex">#FF6467</span></div>
          <span class="badge">保存失败</span>
        </li>
      </ul>
    </section>
  </div>
</figure>
<style>
  #esoboy-status-palette {
    container-type: inline-size;
    margin: 0;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
  }
  #esoboy-status-palette figcaption {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 2px 12px;
    margin-bottom: 12px;
    font-weight: 500;
  }
  #esoboy-status-palette .color-note {
    color: var(--muted-foreground);
    font-size: 12px;
    font-weight: 400;
  }
  #esoboy-status-palette .theme-pair {
    display: grid;
    gap: 12px;
  }
  #esoboy-status-palette .palette-theme {
    min-width: 0;
    padding: 12px 14px 14px;
    border-radius: 12px;
    background-color: light-dark(oklch(1 0 0), oklch(0.145 0 0));
    color: light-dark(oklch(0 0 0), oklch(0.985 0 0));
  }
  #esoboy-status-palette .theme-light { color-scheme: light; }
  #esoboy-status-palette .theme-dark { color-scheme: dark; }
  #esoboy-status-palette h3 {
    margin: 0 0 10px;
    color: inherit;
    font: 500 14px/1.5 system-ui, "Microsoft YaHei", sans-serif;
  }
  #esoboy-status-palette .samples {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #esoboy-status-palette .samples li {
    --soft: color-mix(in oklch, var(--fill) 12%, transparent);
    display: grid;
    gap: 8px;
    justify-items: start;
    align-content: start;
  }
  #esoboy-status-palette li[data-status="neutral"] {
    --fill: light-dark(oklch(0.97 0 0), oklch(0.269 0 0));
    --on-fill: light-dark(oklch(0.205 0 0), oklch(0.985 0 0));
    --ink: var(--on-fill);
    --soft: var(--fill);
  }
  #esoboy-status-palette li[data-status="info"] {
    --fill: light-dark(oklch(0.5 0.134 242.749), oklch(0.746 0.16 232.661));
    --on-fill: light-dark(white, oklch(0.293 0.066 243.157));
    --ink: light-dark(oklch(0.443 0.11 240.79), oklch(0.828 0.111 230.318));
  }
  #esoboy-status-palette li[data-status="success"] {
    --fill: light-dark(oklch(0.508 0.118 165.612), oklch(0.765 0.177 163.223));
    --on-fill: light-dark(white, oklch(0.262 0.051 172.552));
    --ink: light-dark(oklch(0.432 0.095 166.913), oklch(0.845 0.143 164.978));
  }
  #esoboy-status-palette li[data-status="warning"] {
    --fill: light-dark(oklch(0.828 0.189 84.429), oklch(0.879 0.169 91.605));
    --on-fill: oklch(0.279 0.077 45.635);
    --ink: light-dark(oklch(0.473 0.137 46.201), oklch(0.924 0.12 95.746));
  }
  #esoboy-status-palette li[data-status="error"] {
    --fill: light-dark(oklch(0.577 0.245 27.325), oklch(0.704 0.191 22.216));
    --on-fill: light-dark(white, #171717);
    --ink: light-dark(oklch(0.505 0.213 27.518), oklch(0.808 0.114 19.571));
  }
  #esoboy-status-palette .swatch {
    width: 100%;
    box-sizing: border-box;
    min-height: 82px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    padding: 10px;
    border-radius: 8px;
    background-color: var(--fill);
    color: var(--on-fill);
  }
  #esoboy-status-palette .label {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 6px;
    font-size: 14px;
    font-weight: 500;
  }
  #esoboy-status-palette .hex,
  #esoboy-status-palette .token {
    font: 400 12px/1.4 ui-monospace, Consolas, monospace;
  }
  #esoboy-status-palette .hex {
    font-weight: 500;
  }
  #esoboy-status-palette .badge {
    background-color: var(--soft);
    color: var(--ink);
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 26px;
    white-space: nowrap;
    font: 500 12px/1 system-ui, "Microsoft YaHei", sans-serif;
  }
  @container (max-width: 610px) {
    #esoboy-status-palette .theme-pair {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    #esoboy-status-palette .samples {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    #esoboy-status-palette .palette-theme { padding: 10px; }
    #esoboy-status-palette .swatch { min-height: 67px; }
  }
</style>
